<title>Konbini Empire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
/* the game's canvas fills the frame; a cream HUD-style card on the night street until the engine starts */
:root {
	color-scheme: dark;
	--night: #1d2233;
	--cream: #fbf3e2;
	--ink: #3b3247;
	--stripe: #e8574a;
	--well: #e6dcc6;
	--shade: #0b0e1a66;
	--face: "Nunito", "Trebuchet MS", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--cream); overflow: hidden; touch-action: none; font-family: var(--face); }
#canvas { position: fixed; inset: 0; display: block; }
#canvas:focus { outline: none; }
#status {
	position: fixed;
	inset: 0;
	display: grid;
	place-items: center;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
	display: grid;
	gap: 12px;
	justify-items: center;
	width: min(340px, 100%);
	box-sizing: border-box;
	padding: 26px 28px 24px;
	border-radius: 28px;
	background: var(--cream);
	color: var(--ink);
	text-align: center;
	box-shadow: 0 8px 0 var(--shade);
}
h1 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1.1; text-wrap: balance; }
#msg { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4; }
#bar { width: 100%; height: 12px; border-radius: 6px; background: var(--well); overflow: hidden; }
#fill { width: 0; height: 100%; border-radius: 6px; background: var(--stripe); transition: width 0.2s; }
@media (prefers-reduced-motion: reduce) { #fill { transition: none; } }
</style>
<canvas id="canvas"></canvas>
<div id="status">
	<div class="card">
		<h1>Konbini Empire</h1>
		<p id="msg">Rolling up the shutters for 06:00…</p>
		<div id="bar"><div id="fill"></div></div>
	</div>
</div>
<script>
const msg = document.getElementById("msg");
const fill = document.getElementById("fill");
const fail = (e) => {
	msg.textContent = "The game couldn't start: " + (e?.message ?? e);
	document.getElementById("bar").hidden = true;
};
addEventListener("unhandledrejection", (e) => fail(e.reason));
// the engine is over the 15 MB file cap, so index.wasm ships gzipped and is unpacked as Godot fetches it
const fetchFile = window.fetch.bind(window);
window.fetch = (url, init) => !String(url).endsWith("index.wasm") ? fetchFile(url, init) : fetchFile(url, init).then((r) =>
	r.ok ? new Response(r.body.pipeThrough(new DecompressionStream("gzip")), { headers: { "Content-Type": "application/wasm" } }) : r);
</script>
<script src="index.js"></script>
<script>
const engine = new Engine($GODOT_CONFIG);
const missing = Engine.getMissingFeatures({ threads: false });
if (missing.length) {
	fail("this browser is missing " + missing.join(", "));
} else {
	engine.startGame({
		onProgress: (current, total) => {
			if (total > 0) fill.style.width = `${(100 * current) / total}%`;
		},
	}).then(() => document.getElementById("status").remove(), fail);
}
</script>
